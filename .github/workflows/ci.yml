name: CI

on:
  push:
    branches: [main]
    # The nightly sync only changes data/; Vercel's build covers that.
    paths-ignore: ["data/**"]
  pull_request:
  # Manual runs (force pushes can skip the path-filtered push trigger).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generates the route types (PageProps etc.) that aren't in git, then type checks.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
